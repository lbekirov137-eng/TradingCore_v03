name: TradingCore Strategy Atlas Price

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradingcore-strategy-atlas-price.yml"

permissions:
  contents: write

concurrency:
  group: tradingcore-atlas-price
  cancel-in-progress: true

jobs:
  atlas-price:
    name: 288-line Binance + OKX price atlas
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
        with:
          ref: reconcile-railway-paper
          path: code
          fetch-depth: 1
      - name: Checkout cloud state
        uses: actions/checkout@v4
        with:
          ref: cloud-state
          path: state
          fetch-depth: 1
      - name: Compile and safety selftest
        working-directory: code
        env:
          TRADING_ENVIRONMENT: PAPER
          LIVE_TRADING: "false"
          PAPER_TRADING: "true"
          DEMO_ONLY: "true"
        run: |
          python3 -m py_compile strategy_atlas_protocol.py strategy_atlas_price_v2.py strategy_atlas_selftest.py
          python3 strategy_atlas_selftest.py
      - name: Run Strategy Atlas price replay
        working-directory: code
        env:
          TRADING_ENVIRONMENT: PAPER
          LIVE_TRADING: "false"
          PAPER_TRADING: "true"
          DEMO_ONLY: "true"
        run: |
          python3 strategy_atlas_price_v2.py --output "$GITHUB_WORKSPACE/state/strategy_atlas_price_runtime"
      - name: Persist atlas result
        working-directory: state
        run: |
          git config user.name "TradingCore Strategy Atlas"
          git config user.email "actions@users.noreply.github.com"
          git add -f strategy_atlas_price_runtime
          if git diff --cached --quiet; then
            echo "No Atlas state changes."
          else
            git commit -m "atlas-price: persist parallel research result"
            git pull --rebase origin cloud-state
            git push origin HEAD:cloud-state
          fi
      - name: Summary
        if: always()
        run: |
          echo "## TradingCore Strategy Atlas Price" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GITHUB_WORKSPACE/state/strategy_atlas_price_runtime/STRATEGY_ATLAS_PRICE_RESULT.json" ]; then
            python3 -c "import json,os;d=json.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'],'state','strategy_atlas_price_runtime','STRATEGY_ATLAS_PRICE_RESULT.json'));print('state:',d.get('state'));print('lanes:',d.get('lane_count'));print('passing:',d.get('passing_lane_count'));print('passing_lanes:',d.get('passing_lanes')[:10]);print('LIVE: disabled')" >> "$GITHUB_STEP_SUMMARY"
          fi
