name: TradingCore Risk-Off Momentum Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "11 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradingcore-risk-off-momentum.yml"

permissions:
  contents: write

concurrency:
  group: tradingcore-risk-off-momentum
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TRADING_ENVIRONMENT: PAPER
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      DEMO_ONLY: "true"

    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
        with:
          ref: reconcile-railway-paper
          path: code
          fetch-depth: 1

      - name: Checkout persistent cloud state
        uses: actions/checkout@v4
        with:
          ref: cloud-state
          path: state
          fetch-depth: 1

      - name: Restore and verify risk-off lab
        working-directory: code
        run: |
          base64 -d research_payloads/daily_regime_ensemble_lab.py.gz.b64 | gzip -d > daily_regime_ensemble_lab.py
          base64 -d research_payloads/risk_off_momentum_lab.py.gz.b64 | gzip -d > risk_off_momentum_lab.py
          python3 -m py_compile daily_regime_ensemble_lab.py risk_off_momentum_lab.py
          grep -q "TRADINGCORE_RISK_OFF_MOMENTUM_V1" risk_off_momentum_lab.py

      - name: Run six-year two-venue robustness screen
        working-directory: code
        run: |
          python3 risk_off_momentum_lab.py --output-dir "$GITHUB_WORKSPACE/state/risk_off_momentum_runtime"

      - name: Persist result
        if: always()
        working-directory: state
        run: |
          git config user.name "TradingCore Risk-Off Momentum"
          git config user.email "actions@users.noreply.github.com"
          git add -f risk_off_momentum_runtime
          if git diff --cached --quiet; then
            echo "No risk-off momentum changes."
          else
            git commit -m "risk-off: update six-year two-venue validation"
            git pull --rebase origin cloud-state
            git push origin HEAD:cloud-state
          fi

      - name: Summary
        if: always()
        run: |
          echo "## TradingCore Risk-Off Momentum" >> "$GITHUB_STEP_SUMMARY"
          RESULT="$GITHUB_WORKSPACE/state/risk_off_momentum_runtime/RISK_OFF_MOMENTUM_RESULT.json"
          if [ -f "$RESULT" ]; then
            export RESULT
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d=json.load(open(os.environ['RESULT'],encoding='utf-8'))
          print('state:',d.get('state'))
          print('selected:',d.get('selected_family'))
          print('passing:',d.get('passing_both_venues'))
          print('data_failures:',d.get('data_failures'))
          for row in d.get('results') or []:
              print('\n',row.get('family'))
              for venue,payload in (row.get('venues') or {}).items():
                  print(venue,'full=',payload.get('full'),'recent=',payload.get('recent_365_days'),'checks=',payload.get('checks'))
          print('LIVE: disabled')
          PY
          else
            echo "Result file missing; inspect job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
