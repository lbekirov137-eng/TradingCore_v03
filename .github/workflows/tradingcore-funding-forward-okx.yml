name: TradingCore BTC Funding Carry Forward — OKX

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradingcore-funding-forward-okx.yml"

permissions:
  contents: write

concurrency:
  group: tradingcore-funding-forward-okx
  cancel-in-progress: true

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRADING_ENVIRONMENT: PAPER
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      DEMO_ONLY: "true"
    steps:
      - name: Checkout frozen strategy code
        uses: actions/checkout@v4
        with:
          ref: reconcile-railway-paper
          path: code
          fetch-depth: 1

      - name: Checkout persistent PAPER state
        uses: actions/checkout@v4
        with:
          ref: cloud-state
          path: state
          fetch-depth: 1

      - name: Compile and run OKX funding carry shadow
        working-directory: code
        run: |
          python3 -m py_compile funding_carry_forward_okx.py
          python3 funding_carry_forward_okx.py --state-dir "$GITHUB_WORKSPACE/state/funding_carry_forward_runtime"

      - name: Persist forward state
        if: always()
        working-directory: state
        run: |
          git config user.name "TradingCore Funding Forward"
          git config user.email "actions@users.noreply.github.com"
          git add -f funding_carry_forward_runtime
          if git diff --cached --quiet; then
            echo "No funding-forward changes."
          else
            git commit -m "funding-forward: update OKX shadow execution"
            git pull --rebase origin cloud-state
            git push origin HEAD:cloud-state
          fi

      - name: Summary
        if: always()
        run: |
          echo "## TradingCore BTC Funding Carry Forward — OKX" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GITHUB_WORKSPACE/state/funding_carry_forward_runtime/FUNDING_CARRY_FORWARD_STATUS.json" ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p=os.path.join(os.environ['GITHUB_WORKSPACE'],'state','funding_carry_forward_runtime','FUNDING_CARRY_FORWARD_STATUS.json')
          d=json.load(open(p,encoding='utf-8'))
          market=d.get('current_market') or {}
          print('strategy:', d.get('strategy'))
          print('avg_last3_funding_bps:', market.get('average_last_three_funding_bps'))
          print('basis_bps:', market.get('basis_bps'))
          print('entry_signal_active:', market.get('entry_signal_active'))
          print('position_open:', bool(d.get('position')))
          print('stats:', d.get('stats'))
          print('micro_live_review_ready:', d.get('micro_live_review_ready'))
          print('LIVE / real orders: DISABLED')
          PY
