name: TradingCore Delta-Neutral Funding Carry Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 2,5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradingcore-funding-carry.yml"

permissions:
  contents: write

concurrency:
  group: tradingcore-funding-carry
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRADING_ENVIRONMENT: PAPER
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      DEMO_ONLY: "true"
    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
        with:
          ref: reconcile-railway-paper
          path: code
          fetch-depth: 1

      - name: Checkout persistent cloud state
        uses: actions/checkout@v4
        with:
          ref: cloud-state
          path: state
          fetch-depth: 1

      - name: Compile and run delta-neutral carry validation V2
        working-directory: code
        run: |
          python3 -m py_compile funding_carry_walkforward.py funding_carry_walkforward_v2.py
          python3 funding_carry_walkforward_v2.py --output-dir "$GITHUB_WORKSPACE/state/funding_carry_runtime"

      - name: Persist funding carry result
        working-directory: state
        run: |
          git config user.name "TradingCore Funding Carry"
          git config user.email "actions@users.noreply.github.com"
          git add -f funding_carry_runtime
          if git diff --cached --quiet; then
            echo "No funding carry changes."
          else
            git commit -m "funding-carry: update delta-neutral validation V2"
            git pull --rebase origin cloud-state
            git push origin HEAD:cloud-state
          fi

      - name: Summary
        if: always()
        run: |
          echo "## TradingCore Delta-Neutral Funding Carry V2" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GITHUB_WORKSPACE/state/funding_carry_runtime/FUNDING_CARRY_RESULT.json" ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p=os.path.join(os.environ['GITHUB_WORKSPACE'],'state','funding_carry_runtime','FUNDING_CARRY_RESULT.json')
          d=json.load(open(p,encoding='utf-8'))
          print('state:', d.get('state'))
          print('selected:', d.get('selected'))
          print('holdout_both_venues:', d.get('selected_holdout_passed_both_venues'))
          print('discovery_candidates:', d.get('discovery_candidates'))
          print('data_failures:', d.get('data_failures'))
          print('LIVE: disabled')
          PY

# V2 rerun: bucketed funding, no same-bar credit, no discovery/holdout leakage.
