name: TradingCore Delta-Neutral Funding Carry Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 2,5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradingcore-funding-carry.yml"

permissions:
  contents: write

concurrency:
  group: tradingcore-funding-carry
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRADING_ENVIRONMENT: PAPER
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      DEMO_ONLY: "true"
    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
        with:
          ref: reconcile-railway-paper
          path: code
          fetch-depth: 1

      - name: Checkout persistent cloud state
        uses: actions/checkout@v4
        with:
          ref: cloud-state
          path: state
          fetch-depth: 1

      - name: Compile and run delta-neutral carry validation V2
        working-directory: code
        run: |
          OUT="$GITHUB_WORKSPACE/state/funding_carry_runtime"
          LOG="$OUT/FUNDING_CARRY_RUN.log"
          RESULT="$OUT/FUNDING_CARRY_RESULT.json"
          mkdir -p "$OUT"
          set +e
          python3 -m py_compile funding_carry_walkforward.py funding_carry_walkforward_v2.py >"$LOG" 2>&1
          RC=$?
          if [ "$RC" -eq 0 ]; then
            python3 funding_carry_walkforward_v2.py --output-dir "$OUT" >>"$LOG" 2>&1
            RC=$?
          fi
          echo "CARRY_RC=$RC" >> "$GITHUB_ENV"
          if [ ! -f "$RESULT" ]; then
            export RESULT LOG RC
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log_path=Path(os.environ['LOG'])
          text=log_path.read_text(encoding='utf-8',errors='replace') if log_path.exists() else ''
          out={
            'schema':'TRADINGCORE_DELTA_NEUTRAL_FUNDING_CARRY_V2_DIAGNOSTIC',
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'state':'FUNDING_CARRY_EXECUTION_FAILED',
            'return_code':int(os.environ.get('RC','-1')),
            'log_tail':text[-12000:],
            'real_orders_enabled':False,
            'live_permission':False,
          }
          Path(os.environ['RESULT']).write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY
          fi

      - name: Persist funding carry result
        if: always()
        working-directory: state
        run: |
          git config user.name "TradingCore Funding Carry"
          git config user.email "actions@users.noreply.github.com"
          git add -f funding_carry_runtime
          if git diff --cached --quiet; then
            echo "No funding carry changes."
          else
            git commit -m "funding-carry: update delta-neutral validation V2"
            git pull --rebase origin cloud-state
            git push origin HEAD:cloud-state
          fi

      - name: Summary
        if: always()
        run: |
          echo "## TradingCore Delta-Neutral Funding Carry V2" >> "$GITHUB_STEP_SUMMARY"
          echo "return_code: ${CARRY_RC:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GITHUB_WORKSPACE/state/funding_carry_runtime/FUNDING_CARRY_RESULT.json" ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p=os.path.join(os.environ['GITHUB_WORKSPACE'],'state','funding_carry_runtime','FUNDING_CARRY_RESULT.json')
          d=json.load(open(p,encoding='utf-8'))
          print('state:', d.get('state'))
          print('selected:', d.get('selected'))
          print('holdout_both_venues:', d.get('selected_holdout_passed_both_venues'))
          print('discovery_candidates:', d.get('discovery_candidates'))
          print('data_failures:', d.get('data_failures'))
          print('log_tail:', str(d.get('log_tail',''))[-1500:])
          print('LIVE: disabled')
          PY

# Diagnostic rerun: corrected carry logic; persist both success and failure evidence.
