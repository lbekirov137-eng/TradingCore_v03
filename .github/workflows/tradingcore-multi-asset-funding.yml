name: TradingCore Multi-Asset Funding Portfolio Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 2,5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradingcore-multi-asset-funding.yml"

permissions:
  contents: write

concurrency:
  group: tradingcore-multi-asset-funding
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRADING_ENVIRONMENT: PAPER
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      DEMO_ONLY: "true"

    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
        with:
          ref: reconcile-railway-paper
          path: code
          fetch-depth: 1

      - name: Checkout persistent cloud state
        uses: actions/checkout@v4
        with:
          ref: cloud-state
          path: state
          fetch-depth: 1

      - name: Restore and verify multi-asset funding lab
        working-directory: code
        run: |
          base64 -d research_payloads/multi_asset_funding_portfolio_lab.py.gz.b64 | gzip -d > multi_asset_funding_portfolio_lab.py
          python3 -m py_compile multi_asset_funding_portfolio_lab.py
          grep -q "TRADINGCORE_MULTI_ASSET_FUNDING_PORTFOLIO_V1" multi_asset_funding_portfolio_lab.py

      - name: Run three-year Binance and OKX validation
        working-directory: code
        run: |
          python3 multi_asset_funding_portfolio_lab.py --output-dir "$GITHUB_WORKSPACE/state/multi_asset_funding_runtime"

      - name: Persist result
        if: always()
        working-directory: state
        run: |
          git config user.name "TradingCore Multi-Asset Funding"
          git config user.email "actions@users.noreply.github.com"
          git add -f multi_asset_funding_runtime
          if git diff --cached --quiet; then
            echo "No multi-asset funding changes."
          else
            git commit -m "multi-funding: update two-venue portfolio validation"
            git pull --rebase origin cloud-state
            git push origin HEAD:cloud-state
          fi

      - name: Summary
        if: always()
        run: |
          echo "## TradingCore Multi-Asset Funding Portfolio" >> "$GITHUB_STEP_SUMMARY"
          RESULT="$GITHUB_WORKSPACE/state/multi_asset_funding_runtime/MULTI_ASSET_FUNDING_RESULT.json"
          if [ -f "$RESULT" ]; then
            export RESULT
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d=json.load(open(os.environ['RESULT'],encoding='utf-8'))
          print('state:',d.get('state'))
          print('selected:',d.get('selected_lane'))
          print('holdout_both_venues:',d.get('selected_holdout_passed_both_venues'))
          print('discovery_candidates:',d.get('discovery_candidates'))
          print('data_failures:',d.get('data_failures'))
          for row in d.get('results') or []:
              print('\n',row.get('lane_id'))
              for venue,payload in (row.get('venues') or {}).items():
                  print(venue,'discovery=',payload.get('discovery'),'holdout=',payload.get('holdout'))
          print('LIVE: disabled')
          PY
          else
            echo "Result file missing; inspect job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
