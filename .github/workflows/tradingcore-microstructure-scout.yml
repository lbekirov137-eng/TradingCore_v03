name: TradingCore Microstructure Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradingcore-microstructure-scout.yml"

permissions:
  contents: write

concurrency:
  group: tradingcore-microstructure-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRADING_ENVIRONMENT: PAPER
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      DEMO_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile-railway-paper
          path: code
      - uses: actions/checkout@v4
        with:
          ref: cloud-state
          path: state
          fetch-depth: 1

      - name: Capture dual-venue snapshot and score consensus lanes
        working-directory: code
        run: |
          python3 -m py_compile strategy_atlas_protocol.py strategy_atlas_microstructure.py microstructure_forward_execution.py microstructure_forward_execution_v2.py
          python3 strategy_atlas_microstructure.py --state-dir "$GITHUB_WORKSPACE/state/strategy_atlas_microstructure_runtime"
          python3 microstructure_forward_execution_v2.py --state-dir "$GITHUB_WORKSPACE/state/strategy_atlas_microstructure_runtime"

      - name: Persist snapshots and dual-venue forward state
        working-directory: state
        run: |
          git config user.name "TradingCore Microstructure Scout"
          git config user.email "actions@users.noreply.github.com"
          git add -f strategy_atlas_microstructure_runtime
          if git diff --cached --quiet; then
            echo "No microstructure changes."
          else
            git commit -m "microstructure: append dual-venue consensus evidence"
            git pull --rebase origin cloud-state
            git push origin HEAD:cloud-state
          fi

      - name: Summary
        if: always()
        run: |
          echo "## TradingCore Microstructure Forward V2" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GITHUB_WORKSPACE/state/strategy_atlas_microstructure_runtime/MICROSTRUCTURE_FORWARD_STATUS.json" ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p=os.path.join(os.environ['GITHUB_WORKSPACE'],'state','strategy_atlas_microstructure_runtime','MICROSTRUCTURE_FORWARD_STATUS.json')
          d=json.load(open(p,encoding='utf-8'))
          print('schema:', d.get('schema'))
          print('after_freeze:', d.get('snapshot_count_after_freeze'))
          print('promising_early:', d.get('promising_early'))
          print('champions:', d.get('champions'))
          print('confirmation:', d.get('confirmation_model'))
          print('LIVE: disabled')
          PY

# V2: require Binance and OKX agreement before an executable signal is scored.
