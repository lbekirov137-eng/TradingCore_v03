[pytest]
# В репозитории принята локальная конвенция резервных копий "*.before_*.py"
# (см. .gitignore:38 — такие файлы намеренно не коммитятся).
#
# Для pytest они ядовиты: имя вроде
#   tests/test_paper_live_loop.before_safe_stop.py
# содержит точки, поэтому импортируется как пакет
# "test_paper_live_loop.before_safe_stop" и валит ВСЮ сборку тестов
# с ModuleNotFoundError ещё на этапе collection — падает не один тест,
# а весь прогон.
#
# Исключаем их из сбора, чтобы локальная резервная копия не могла
# заблокировать запуск тестов.
addopts = --ignore-glob=*.before_*.py
testpaths = tests
